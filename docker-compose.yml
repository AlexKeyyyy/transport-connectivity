services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: transport_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transport_connectivity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transport_connectivity}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
