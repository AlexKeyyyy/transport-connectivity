[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transport-connectivity"
version = "0.1.0"
description = "Analysis of transport connectivity between Russian cities with graph methods (M0: data and architecture)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Transport Connectivity Team" }]
keywords = ["transport", "connectivity", "graph", "osm", "gis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
app = [
  "folium==0.20.0",
  "streamlit==1.67.0",
  "streamlit-folium==0.27.4",
]
neo4j = ["neo4j==5.26.0"]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transport_connectivity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "db: requires a dedicated PostgreSQL/PostGIS test database",
  "neo4j: requires a dedicated Neo4j test database",
]

[tool.ruff]
# Keep the pinned third-party notebook helper unchanged; integrity is checked separately.
extend-exclude = [".agents/skills/jupyter-notebook"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"
