[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transport-connectivity"
version = "0.1.0"
description = "Analysis of transport connectivity between Russian cities with graph methods (M0: data and architecture)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Transport Connectivity Team" }]
keywords = ["transport", "connectivity", "graph", "osm", "gis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transport_connectivity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"
