name: Checks

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/dev/check.py

  database:
    name: Database checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: transport
          POSTGRES_PASSWORD: transport_password
          POSTGRES_DB: transport_connectivity
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U transport -d transport_connectivity"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport_password
      POSTGRES_DB: transport_connectivity
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m transport_connectivity.cli migrate
      - run: python -m pytest -m db -v

  graph:
    name: Neo4j projection checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      neo4j:
        image: neo4j:5.26.0
        env:
          NEO4J_AUTH: neo4j/transport_ci_password
          NEO4J_PLUGINS: '["graph-data-science"]'
        ports:
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p transport_ci_password 'RETURN gds.version()'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: transport_ci_password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,neo4j]"
      - run: python -m pytest -m neo4j -v
